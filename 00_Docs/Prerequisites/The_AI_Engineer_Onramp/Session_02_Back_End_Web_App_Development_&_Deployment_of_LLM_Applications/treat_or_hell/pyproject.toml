[project]
name = "treat-or-hell"
version = "0.1.0"
description = "A FastAPI app that lets you chat with St. Nicholas, an Angel, or a Devil using the OpenAI Chat Completions API"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "fastapi>=0.162.0",
    "uvicorn>=0.54.0",
    "openai>=3.46.0",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.33",
    "pydantic>=2.14.3",
]
